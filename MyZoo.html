<html>
    <head>
        <title>My Zoo</title>
        <style>
            body{
                font-family: fantasy;
                background-color: cornsilk;
                text-align: center;
                padding: 80px
            }
            h1{
                color: brown;
            }
            #zoo{
                border: 5px solid orange;
                width: 250px;
                margin: 16px auto;
                padding: 20px;
                border-radius: 10px;
                background: bisque;
            }
            .zone{
                border: 2px solid peru;
                margin: 15px;
                padding: 8px;
                border-radius: 8px;
                text-align: left;
            }
            button{
                background-color: green;
                color: burlywood;
                padding: 10px;
                border-radius: 10px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <h1>My Zoo</h1>
        <p>Use javascript and DOM to add animals to each cage</p>

        <div id="zoo">
            <div class="zone">Zone-1: <span id="zone1"> </span></div>
            <div class="zone">Zone-2: <span id="zone2"> </span></div>
            <div class="zone">Zone-3: <span id="zone3"> </span></div>
            <div class="zone">Total Animals: <span id="total"> </span></div>

            <br>
            <br>
            <br>
            <button onclick="openzoo()">Open The Zoo</button>
            <p id="zoostatus"></p>

            <script>
                function openzoo(){
                    document.getElementById("zone1").innerHTML="Lion";
                    document.getElementById("zone2").innerHTML = "Elephant";
                    document.getElementById("zone3").innerHTML = "Hyena";
                    document.getElementById("total").innerHTML="3";
                    document.getElementById("zoo").style.backgroundColor="coral";
                    document.getElementById("zoostatus").innerHTML=document.title + " is now open"
                }
            </script>
        </div>
    </body>
</html>
